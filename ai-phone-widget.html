<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oqqush Beton AI Phone Widget</title>
  <style>
    :root {
      color-scheme: dark;
      --call-green: #22c55e;
      --call-green-deep: #128c4a;
      --call-red: #ef4444;
      --panel-bg: rgba(7, 13, 18, 0.94);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: rgba(226, 232, 240, 0.68);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(34, 197, 94, 0.14), transparent 28rem),
        linear-gradient(135deg, #07100d 0%, #0e1724 52%, #111827 100%);
      color: var(--text-main);
    }

    .demo-page {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    .demo-page h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2.2rem, 7vw, 5rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .demo-page p {
      max-width: 42rem;
      margin: 0 auto;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .ai-call-button {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 1000;
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, #35d46f, #0b8d4b);
      box-shadow: 0 18px 42px rgba(34, 197, 94, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
    }

    .ai-call-button::before,
    .ai-call-button::after {
      content: "";
      position: absolute;
      inset: -8px;
      border: 1px solid rgba(34, 197, 94, 0.38);
      border-radius: inherit;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    .ai-call-button:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 24px 60px rgba(34, 197, 94, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .ai-call-button:active {
      transform: scale(0.96);
    }

    .ai-call-button.is-ringing::before,
    .ai-call-button.is-ringing::after {
      animation: callButtonPulse 1.45s ease-out infinite;
    }

    .ai-call-button.is-ringing::after {
      animation-delay: 0.55s;
    }

    .ai-call-button svg {
      width: 28px;
      height: 28px;
      stroke-width: 2.6;
    }

    .call-overlay {
      position: fixed;
      inset: 0;
      z-index: 1001;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 18px;
      background: rgba(2, 6, 10, 0.6);
      backdrop-filter: blur(12px);
    }

    .call-overlay.is-open {
      display: flex;
    }

    .call-card {
      width: min(100%, 420px);
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 14%, rgba(34, 197, 94, 0.2), transparent 11rem),
        linear-gradient(180deg, rgba(17, 24, 39, 0.98), var(--panel-bg));
      box-shadow: 0 26px 90px rgba(0, 0, 0, 0.52);
      transform: translateY(16px) scale(0.96);
      opacity: 0;
      animation: callCardIn 260ms ease forwards;
    }

    .call-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 24px 22px;
      text-align: center;
    }

    .pulse-avatar {
      position: relative;
      width: 132px;
      height: 132px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
    }

    .pulse-avatar::before,
    .pulse-avatar::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 999px;
      border: 1px solid rgba(34, 197, 94, 0.42);
      animation: avatarPulse 2s ease-out infinite;
    }

    .pulse-avatar::after {
      animation-delay: 0.72s;
    }

    .logo-circle {
      position: relative;
      z-index: 1;
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: linear-gradient(145deg, rgba(34, 197, 94, 0.96), rgba(8, 47, 73, 0.96));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 44px rgba(34, 197, 94, 0.3);
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .company-name {
      margin: 0 0 6px;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .caller-name {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 700;
    }

    .call-timer {
      margin-top: 14px;
      padding: 6px 12px;
      border: 1px solid rgba(34, 197, 94, 0.24);
      border-radius: 999px;
      color: #bbf7d0;
      background: rgba(34, 197, 94, 0.08);
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .call-status {
      min-height: 26px;
      margin: 18px 0 0;
      color: #86efac;
      font-size: 0.84rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .sound-waves {
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 6px;
      height: 48px;
      margin: 18px auto 2px;
      opacity: 0.3;
      transition: opacity 180ms ease;
    }

    .sound-waves.is-active {
      opacity: 1;
    }

    .sound-waves span {
      width: 5px;
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, #bbf7d0, var(--call-green));
      animation: waveIdle 1.1s ease-in-out infinite;
      animation-play-state: paused;
    }

    .sound-waves.is-active span {
      animation-play-state: running;
    }

    .sound-waves span:nth-child(2) { animation-delay: 0.1s; }
    .sound-waves span:nth-child(3) { animation-delay: 0.2s; }
    .sound-waves span:nth-child(4) { animation-delay: 0.3s; }
    .sound-waves span:nth-child(5) { animation-delay: 0.4s; }

    .transcript-box {
      margin: 0 20px 20px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--text-muted);
      font-size: 0.86rem;
      line-height: 1.55;
    }

    .transcript-box strong {
      display: block;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .call-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.24);
    }

    .call-action {
      height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 18px;
      color: white;
      font-weight: 900;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .call-action:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .call-action:active {
      transform: scale(0.98);
    }

    .mute-button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .mute-button.is-muted {
      background: rgba(148, 163, 184, 0.26);
      color: #cbd5e1;
    }

    .hangup-button {
      background: linear-gradient(135deg, #ff6b6b, #dc2626);
      box-shadow: 0 14px 38px rgba(239, 68, 68, 0.28);
    }

    .mic-indicator {
      display: inline-grid;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      border-radius: 999px;
      background: #64748b;
      vertical-align: middle;
    }

    .mic-indicator.is-active {
      background: var(--call-green);
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.14);
    }

    @keyframes callButtonPulse {
      0% { opacity: 0.8; transform: scale(0.88); }
      70% { opacity: 0; transform: scale(1.38); }
      100% { opacity: 0; transform: scale(1.38); }
    }

    @keyframes callCardIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes avatarPulse {
      0% { opacity: 0.62; transform: scale(0.72); }
      80% { opacity: 0; transform: scale(1.18); }
      100% { opacity: 0; transform: scale(1.18); }
    }

    @keyframes waveIdle {
      0%, 100% { height: 12px; }
      50% { height: 38px; }
    }

    @media (max-width: 520px) {
      .call-overlay {
        align-items: stretch;
        padding: 0;
      }

      .call-card {
        width: 100%;
        min-height: 100svh;
        border-radius: 0;
      }

      .call-top {
        padding-top: max(38px, env(safe-area-inset-top));
      }

      .call-actions {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <main class="demo-page" aria-hidden="true">
    <div>
      <h1>Oqqush Beton</h1>
      <p>Floating AI phone call widget demo. Paste this file into any HTML website, then set your Gemini API key in the CONFIG block.</p>
    </div>
  </main>

  <button class="ai-call-button" id="aiCallButton" type="button" aria-label="Oqqush Beton virtual agentiga qo'ng'iroq qilish">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.78 19.78 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.78 19.78 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.35 1.89.66 2.78a2 2 0 0 1-.45 2.11L8.05 9.88a16 16 0 0 0 6.07 6.07l1.27-1.27a2 2 0 0 1 2.11-.45c.89.31 1.82.53 2.78.66A2 2 0 0 1 22 16.92z"/>
    </svg>
  </button>

  <section class="call-overlay" id="callOverlay" aria-live="polite" aria-modal="true" role="dialog">
    <div class="call-card">
      <div class="call-top">
        <div class="pulse-avatar" aria-hidden="true">
          <div class="logo-circle">OB</div>
        </div>
        <h2 class="company-name">Oqqush Beton</h2>
        <p class="caller-name">Virtual Agent</p>
        <div class="call-timer" id="callTimer">00:00</div>
        <div class="call-status" id="callStatus">Ulanmoqda...</div>
        <div class="sound-waves" id="soundWaves" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="transcript-box">
        <strong>Holat</strong>
        <span class="mic-indicator" id="micIndicator"></span>
        <span id="callHint">Qo'ng'iroq boshlash uchun yashil tugmani bosing.</span>
      </div>

      <div class="call-actions">
        <button class="call-action mute-button" id="muteButton" type="button">
          <span id="muteLabel">Mute</span>
        </button>
        <button class="call-action hangup-button" id="hangupButton" type="button">
          Hang up
        </button>
      </div>
    </div>
  </section>

  <script>
    // CONFIG - change these values:
    // GEMINI_API_KEY = "your key here" for local direct testing only.
    // GEMINI_PROXY_URL keeps the API key on your server in production.
    // COMPANY_INFO = { update company details here }
    //
    // Production note: putting a permanent API key in browser JavaScript exposes it to users.
    // For a real public website, use a backend endpoint that returns short-lived Gemini ephemeral tokens.
    const CONFIG = {
      GEMINI_API_KEY: "YOUR_GEMINI_API_KEY",
      GEMINI_PROXY_URL: location.protocol.startsWith("http")
        ? `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/gemini-live`
        : "",
      GEMINI_MODEL: "gemini-2.5-flash-native-audio-latest",
      GEMINI_VOICE: "Charon", // Male options: "Charon" or "Fenrir"
      // Native-audio Live models currently reject uz-UZ in speechConfig.
      // Uzbek is enforced through the system prompt instead.
      LANGUAGE_CODE: "",
      INPUT_SAMPLE_RATE: 16000,
      OUTPUT_SAMPLE_RATE: 24000,
      COMPANY_INFO: {
        name: "Oqqush Beton",
        products: "Qurilish uchun beton, armaturali beton konstruksiyalar, temir-beton ustunlar, plitalar",
        services: "Beton yetkazib berish, qurilish konsultatsiyasi",
        hours: "Dushanba-Shanba 08:00-18:00",
        address: "[MANZILNI SHU YERGA KIRITING]",
        phone: "[TELEFON RAQAMNI SHU YERGA KIRITING]"
      }
    };

    const SYSTEM_PROMPT = `
Siz Oqqush Beton kompaniyasining professional virtual agentiasiz.
Siz faqat quyidagi ma'lumotlar asosida javob berasiz:

KOMPANIYA MA'LUMOTLARI:
- Kompaniya nomi: ${CONFIG.COMPANY_INFO.name}
- Mahsulotlar: ${CONFIG.COMPANY_INFO.products}
- Xizmatlar: ${CONFIG.COMPANY_INFO.services}
- Ish vaqti: ${CONFIG.COMPANY_INFO.hours}
- Manzil: ${CONFIG.COMPANY_INFO.address}
- Telefon: ${CONFIG.COMPANY_INFO.phone}

Faqat kompaniya haqida savollarga javob bering.
Boshqa mavzularda: "Bu mavzu bo'yicha sizga yordam bera olmayman, lekin beton va qurilish bo'yicha savollaringizga javob berishga tayyorman" deb ayting.
Har doim muloyim, professional va qisqa javob bering. Uzbek tilida gaplashing.
`.trim();

    const ui = {
      callButton: document.getElementById("aiCallButton"),
      overlay: document.getElementById("callOverlay"),
      status: document.getElementById("callStatus"),
      timer: document.getElementById("callTimer"),
      hint: document.getElementById("callHint"),
      waves: document.getElementById("soundWaves"),
      mic: document.getElementById("micIndicator"),
      muteButton: document.getElementById("muteButton"),
      muteLabel: document.getElementById("muteLabel"),
      hangupButton: document.getElementById("hangupButton")
    };

    let ws = null;
    let micStream = null;
    let mediaRecorder = null;
    let audioContext = null;
    let inputContext = null;
    let micSource = null;
    let inputProcessor = null;
    let playbackTime = 0;
    let callStartedAt = 0;
    let timerId = 0;
    let isMuted = false;
    let isConnected = false;
    let isCalling = false;

    ui.callButton.addEventListener("click", startPhoneCall);
    ui.hangupButton.addEventListener("click", endPhoneCall);
    ui.muteButton.addEventListener("click", toggleMute);

    async function startPhoneCall() {
      if (isCalling) return;
      isCalling = true;
      isMuted = false;
      updateMuteUi();
      setStatus("Ulanmoqda...");
      setHint("Telefon chaqirilmoqda...");
      ui.callButton.classList.add("is-ringing");

      try {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();

        await playRingPattern();
        ui.callButton.classList.remove("is-ringing");
        ui.overlay.classList.add("is-open");
        setStatus("Ulanmoqda...");
        setHint("Mikrofon ruxsatini bering va gapirishga tayyorlaning.");

        await connectGeminiLive();
      } catch (error) {
        console.error(error);
        setStatus("Xatolik");
        setHint(error.message || "Qo'ng'iroqni boshlashda xatolik yuz berdi.");
        ui.callButton.classList.remove("is-ringing");
        isCalling = false;
      }
    }

    async function playRingPattern() {
      await playRingTone(2000);
      await wait(1500);
      await playRingTone(2000);
    }

    function playRingTone(durationMs) {
      return new Promise((resolve) => {
        const ctx = audioContext;
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime;
        const duration = durationMs / 1000;
        const fade = 0.08;

        oscillator.type = "sine";
        oscillator.frequency.value = 440;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.24, now + fade);
        gain.gain.setValueAtTime(0.24, now + Math.max(fade, duration - fade));
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        oscillator.connect(gain).connect(ctx.destination);
        oscillator.start(now);
        oscillator.stop(now + duration);
        oscillator.onended = () => resolve();
      });
    }

    async function connectGeminiLive() {
      const useDirectGeminiKey = !CONFIG.GEMINI_PROXY_URL;
      if (useDirectGeminiKey && (!CONFIG.GEMINI_API_KEY || CONFIG.GEMINI_API_KEY === "YOUR_GEMINI_API_KEY")) {
        throw new Error("CONFIG ichiga Gemini API key qo'ying: YOUR_GEMINI_API_KEY.");
      }

      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      startMediaRecorder();
      setupMicPcmStreamer();

      const endpoint = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent";
      const websocketUrl = CONFIG.GEMINI_PROXY_URL || `${endpoint}?key=${encodeURIComponent(CONFIG.GEMINI_API_KEY)}`;
      ws = new WebSocket(websocketUrl);
      ws.onopen = sendSetupMessage;
      ws.onmessage = handleGeminiMessage;
      ws.onerror = () => {
        setStatus("Xatolik");
        setHint("Gemini Live ulanishida xatolik yuz berdi.");
      };
      ws.onclose = () => {
        if (isCalling) endPhoneCall(false);
      };
    }

    function sendSetupMessage() {
      const speechConfig = {
        voiceConfig: {
          prebuiltVoiceConfig: {
            voiceName: CONFIG.GEMINI_VOICE
          }
        }
      };
      if (CONFIG.LANGUAGE_CODE) speechConfig.languageCode = CONFIG.LANGUAGE_CODE;

      ws.send(JSON.stringify({
        setup: {
          model: `models/${CONFIG.GEMINI_MODEL}`,
          systemInstruction: {
            parts: [{ text: SYSTEM_PROMPT }]
          },
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig
          },
          realtimeInputConfig: {
            automaticActivityDetection: {
              disabled: false,
              startOfSpeechSensitivity: "START_SENSITIVITY_HIGH",
              endOfSpeechSensitivity: "END_SENSITIVITY_HIGH",
              silenceDurationMs: 700
            }
          },
          inputAudioTranscription: {},
          outputAudioTranscription: {}
        }
      }));
    }

    function handleGeminiMessage(event) {
      const message = JSON.parse(event.data);

      if (message.setupComplete) {
        isConnected = true;
        startTimer();
        setStatus("Ulandi");
        setHint("Virtual agent salomlashmoqda...");
        sendInitialGreetingRequest();
        return;
      }

      const content = message.serverContent;
      if (content?.interrupted) {
        stopWaveform();
        setStatus("Tinglamoqda...");
        resetAudioQueue();
      }

      if (content?.inputTranscription?.text) {
        setStatus("Tinglamoqda...");
        setHint(`Siz: ${content.inputTranscription.text}`);
        setMicActive(true);
      }

      if (content?.outputTranscription?.text) {
        setStatus("Javob bermoqda...");
        setHint(`Agent: ${content.outputTranscription.text}`);
      }

      if (content?.modelTurn?.parts) {
        for (const part of content.modelTurn.parts) {
          const inlineData = part.inlineData || part.inline_data;
          if (inlineData?.data) {
            setStatus("Javob bermoqda...");
            startWaveform();
            playPcm16Base64(inlineData.data, CONFIG.OUTPUT_SAMPLE_RATE);
          }
        }
      }

      if (content?.turnComplete || content?.generationComplete) {
        setStatus("Tinglamoqda...");
        setMicActive(!isMuted);
        setTimeout(stopWaveform, 500);
      }

      if (message.goAway) {
        setHint("Sessiya yakunlanmoqda. Qayta qo'ng'iroq qiling.");
      }
    }

    function sendInitialGreetingRequest() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        clientContent: {
          turns: [{
            role: "user",
            parts: [{
              text: "Suhbatni aynan mana shu salomlashuv bilan boshlang: Assalamu aleykum! Men Oqqush Beton kompaniyasining virtual agentiman. Qanday yordam bera olaman?"
            }]
          }],
          turnComplete: true
        }
      }));
    }

    function startMediaRecorder() {
      if (!window.MediaRecorder) return;
      mediaRecorder = new MediaRecorder(micStream);
      mediaRecorder.ondataavailable = () => {
        // MediaRecorder keeps a browser-native capture session alive.
        // Raw PCM streaming is handled by Web Audio below because Gemini expects PCM16.
      };
      mediaRecorder.start(1000);
    }

    function setupMicPcmStreamer() {
      inputContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: CONFIG.INPUT_SAMPLE_RATE });
      micSource = inputContext.createMediaStreamSource(micStream);

      // ScriptProcessorNode is deprecated but remains the broadest single-file option.
      // For large production apps, replace it with an AudioWorklet.
      inputProcessor = inputContext.createScriptProcessor(4096, 1, 1);
      inputProcessor.onaudioprocess = (event) => {
        if (!ws || ws.readyState !== WebSocket.OPEN || !isConnected || isMuted) return;
        const input = event.inputBuffer.getChannelData(0);
        const pcm16 = float32ToPcm16(input);
        const base64 = arrayBufferToBase64(pcm16.buffer);

        ws.send(JSON.stringify({
          realtimeInput: {
            audio: {
              data: base64,
              mimeType: `audio/pcm;rate=${CONFIG.INPUT_SAMPLE_RATE}`
            }
          }
        }));

        setMicActive(getAudioLevel(input) > 0.018);
      };

      micSource.connect(inputProcessor);
      inputProcessor.connect(inputContext.destination);
    }

    function float32ToPcm16(float32Array) {
      const pcm16 = new Int16Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i += 1) {
        const sample = Math.max(-1, Math.min(1, float32Array[i]));
        pcm16[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      }
      return pcm16;
    }

    function playPcm16Base64(base64Audio, sampleRate) {
      const bytes = base64ToUint8Array(base64Audio);
      const pcm = new Int16Array(bytes.buffer);
      const buffer = audioContext.createBuffer(1, pcm.length, sampleRate);
      const channel = buffer.getChannelData(0);

      for (let i = 0; i < pcm.length; i += 1) {
        channel[i] = pcm[i] / 32768;
      }

      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);

      const now = audioContext.currentTime;
      playbackTime = Math.max(playbackTime, now + 0.02);
      source.start(playbackTime);
      playbackTime += buffer.duration;
      source.onended = () => {
        if (audioContext.currentTime >= playbackTime - 0.08) stopWaveform();
      };
    }

    function resetAudioQueue() {
      playbackTime = audioContext ? audioContext.currentTime : 0;
    }

    function toggleMute() {
      isMuted = !isMuted;
      if (micStream) {
        micStream.getAudioTracks().forEach((track) => {
          track.enabled = !isMuted;
        });
      }
      updateMuteUi();
      setStatus(isMuted ? "Mikrofon o'chirilgan" : "Tinglamoqda...");
      setMicActive(!isMuted);
    }

    function updateMuteUi() {
      ui.muteButton.classList.toggle("is-muted", isMuted);
      ui.muteLabel.textContent = isMuted ? "Unmute" : "Mute";
    }

    function endPhoneCall(closeSocket = true) {
      isCalling = false;
      isConnected = false;
      ui.callButton.classList.remove("is-ringing");
      ui.overlay.classList.remove("is-open");
      stopWaveform();
      setMicActive(false);
      stopTimer();
      resetAudioQueue();

      if (closeSocket && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
        ws.close(1000, "Call ended");
      }
      ws = null;

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      mediaRecorder = null;

      if (inputProcessor) {
        inputProcessor.disconnect();
        inputProcessor.onaudioprocess = null;
      }
      inputProcessor = null;

      if (micSource) micSource.disconnect();
      micSource = null;

      if (inputContext) inputContext.close();
      inputContext = null;

      if (micStream) {
        micStream.getTracks().forEach((track) => track.stop());
      }
      micStream = null;

      setStatus("Ulanmoqda...");
      setHint("Qo'ng'iroq tugadi.");
    }

    function startTimer() {
      callStartedAt = Date.now();
      stopTimer();
      timerId = window.setInterval(() => {
        const elapsed = Math.floor((Date.now() - callStartedAt) / 1000);
        const minutes = String(Math.floor(elapsed / 60)).padStart(2, "0");
        const seconds = String(elapsed % 60).padStart(2, "0");
        ui.timer.textContent = `${minutes}:${seconds}`;
      }, 250);
    }

    function stopTimer() {
      window.clearInterval(timerId);
      timerId = 0;
      ui.timer.textContent = "00:00";
    }

    function setStatus(text) {
      ui.status.textContent = text;
    }

    function setHint(text) {
      ui.hint.textContent = text;
    }

    function startWaveform() {
      ui.waves.classList.add("is-active");
    }

    function stopWaveform() {
      ui.waves.classList.remove("is-active");
    }

    function setMicActive(active) {
      ui.mic.classList.toggle("is-active", Boolean(active));
    }

    function getAudioLevel(samples) {
      let sum = 0;
      for (let i = 0; i < samples.length; i += 1) {
        sum += samples[i] * samples[i];
      }
      return Math.sqrt(sum / samples.length);
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function base64ToUint8Array(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function wait(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }
  </script>
</body>
